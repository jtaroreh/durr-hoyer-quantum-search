name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies (locked)
      run: uv sync --locked --all-extras --python 3.12

    - name: Run linter (ruff)
      run: uv run ruff check .

    - name: Run type checker (mypy)
      run: uv run mypy closest_search demo.py scaling.py

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies (locked)
      run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

    - name: Run tests with coverage
      run: uv run pytest --cov=closest_search --cov-report=term-missing --cov-fail-under=85 tests/

  build-and-smoke:
    name: Build & Packaged Smoke Runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies (locked)
      run: uv sync --locked --all-extras --python 3.12

    - name: Verify package build
      run: uv run python -m build

    - name: Test installed wheel entry points in isolated environment
      run: |
        uv venv /tmp/isolated-env --python 3.12
        WHEEL_FILE=$(ls dist/*.whl | head -n 1)
        uv pip install --python /tmp/isolated-env "${WHEEL_FILE}[all]"
        /tmp/isolated-env/bin/durr-hoyer-demo --n 3 --m 4
        /tmp/isolated-env/bin/durr-hoyer-scale --max-n 4
        /tmp/isolated-env/bin/durr-heyer-demo --n 3 --m 4
        /tmp/isolated-env/bin/durr-heyer-scale --max-n 4


